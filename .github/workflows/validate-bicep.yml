name: validate-bicep

# Compiles and lints every Bicep template in the repo. No Azure login and no deployment:
# this is free, fast feedback and needs no subscription or secrets.

on:
  pull_request:
    paths:
      - "**/*.bicep"
      - "**/*.bicepparam"
      - "**/bicepconfig.json"
      - ".github/workflows/validate-bicep.yml"
  push:
    branches: [main]
    paths:
      - "**/*.bicep"
      - "**/*.bicepparam"
      - "**/bicepconfig.json"
      - ".github/workflows/validate-bicep.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BICEP_VERSION: v0.49.2
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Bicep CLI
        run: |
          set -euo pipefail
          curl -sSL -o bicep \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build and lint every Bicep file
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(**/*.bicep)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .bicep files found."
            exit 0
          fi
          rc=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            # build fails on compile errors; it also surfaces linter diagnostics.
            if ! bicep build "$f" --stdout > /dev/null; then
              echo "::error file=$f::bicep build failed"
              rc=1
            fi
            bicep lint "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc
