name: validate-shell

# Lints, syntax-checks and tests every shell script in the repo. No Azure login: the mission
# test suites run the real scripts against a fake `az`, so this is free and needs no secrets.

on:
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/validate-shell.yml"
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/validate-shell.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      # SHA-256 of shellcheck-<version>.linux.x86_64.tar.xz. Update both together when upgrading.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned ShellCheck (checksum-verified)
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "${archive}"
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck every shell script
        run: |
          set -uo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "Checking ${#scripts[@]} script(s)."
          # -x follows `source`d files (each script sources its mission's cli/_common.sh).
          # --format=gcc gives file:line:col lines, which GitHub turns into annotations below.
          if out="$(shellcheck -x --format=gcc "${scripts[@]}")"; then
            echo "ShellCheck: no findings."
            echo "### ShellCheck ${SHELLCHECK_VERSION}: ${#scripts[@]} script(s), no findings" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "${out}"
          echo "${out}" | while IFS=: read -r file line col rest; do
            echo "::error file=${file},line=${line},col=${col}::${rest# }"
          done
          {
            echo "### ShellCheck ${SHELLCHECK_VERSION}: findings"
            echo '```'
            echo "${out}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every shell script
        run: |
          set -uo pipefail
          bash --version | head -1
          failed=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok  $f"
            else
              echo "::error file=$f::bash syntax check failed"
              failed=$((failed + 1))
            fi
          done < <(git ls-files '*.sh')
          if [ "${failed}" -ne 0 ]; then
            echo "### bash -n: ${failed} script(s) failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### bash -n: all scripts parse" >> "$GITHUB_STEP_SUMMARY"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run mission CLI test suites (fake az, offline)
        run: |
          set -uo pipefail
          failed=()
          mapfile -t suites < <(git ls-files 'missions/*/tests/test_*.sh')
          for t in "${suites[@]}"; do
            echo "::group::$t"
            if ! bash "$t"; then
              echo "::error file=$t::test suite failed"
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          {
            echo "### Mission CLI tests"
            echo "- ${#suites[@]} suite(s), ${#failed[@]} failed"
            if [ ${#failed[@]} -ne 0 ]; then printf -- '  - %s\n' "${failed[@]}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ ${#failed[@]} -eq 0 ]
